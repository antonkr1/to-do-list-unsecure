---
- name: J1 Infra, automatisation et sécurisation
  hosts: app
  become: true

  vars:
    app_user: todo
    app_dir: /opt/todo
    app_src: "{{ app_dir }}/app"
    app_venv: "{{ app_dir }}/venv"
    app_repo: https://github.com/antonkr1/to-do-list-unsecure.git
    app_branch: main
    app_port: 8000
    service_name: todolist
    python_packages:
      - django==6
      - pyyaml==5.3.1
      - requests==2.19.1
      - gunicorn

  tasks:
    - name: J2 - La prod ne reçoit que la branche main
      ansible.builtin.assert:
        that: app_branch == 'main'
        fail_msg: "Refusé : seule la branche main peut être déployée en production (demandé : {{ app_branch }})"
      when: "'prod' in group_names"

    - name: 9 - Installer les paquets système
      ansible.builtin.apt:
        name:
          - git
          - sqlite3
          - python3-venv
          - python3-packaging
          - acl
        update_cache: true

    - name: 17 - User moindre privilège todo
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        home: "{{ app_dir }}"
        create_home: true
        shell: /usr/sbin/nologin

    - name: 9 - Cloner le dépôt de l'application ({{ app_branch }})
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_src }}"
        version: "{{ app_branch }}"
        force: true
      become_user: "{{ app_user }}"
      notify: Redémarrer todolist

    - name: 12 - (DEBUG = False)
      ansible.builtin.lineinfile:
        path: "{{ app_src }}/todo/settings.py"
        regexp: '^DEBUG\s*='
        line: "DEBUG = False"
      when: not django_debug
      notify: Redémarrer todolist

    - name: 9 - Dépendances Python dans un virtualenv
      ansible.builtin.pip:
        name: "{{ python_packages }}"
        virtualenv: "{{ app_venv }}"
        virtualenv_command: python3 -m venv
      notify: Redémarrer todolist

    - name: 9 - Django SQLite
      ansible.builtin.command:
        cmd: "{{ app_venv }}/bin/python manage.py migrate --noinput"
        chdir: "{{ app_src }}"
      become_user: "{{ app_user }}"
      register: migrate_result
      changed_when: "'No migrations to apply' not in migrate_result.stdout"

    - name: 13 - Install systemd {{ service_name }}
      ansible.builtin.template:
        src: todolist.service.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: "0644"
      notify: Redémarrer todolist

    - name: 13 - Activer systemd {{ service_name }}
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Restart pour appliquer les modifs
      ansible.builtin.meta: flush_handlers

    - name: 11 - Contrôler de l'URL (HTTP 200)
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port }}/"
        status_code: 200
      delegate_to: localhost
      become: false
      register: app_check
      retries: 5
      delay: 3
      until: app_check.status == 200

    - name: 11 - page 404 (debug)
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ app_port }}/page-inexistante/"
        status_code: 404
        return_content: true
      delegate_to: localhost
      become: false
      register: page_404

    - name: 11 - Vérif debug
      ansible.builtin.assert:
        that:
          - ("URLconf" in page_404.content) == django_debug
        success_msg: "{{ inventory_hostname }} ({{ env_name }}) : DEBUG = {{ django_debug }}, conforme"
        fail_msg: "{{ inventory_hostname }} ({{ env_name }}) : le mode DEBUG ne correspond pas à l'attendu !"

  handlers:
    - name: Redémarrer todolist
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true
