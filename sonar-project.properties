sonar.projectKey=todolist
sonar.projectName=todolist
sonar.sources=tasks,todo
sonar.exclusions=**/migrations/**,**/tests.py,ansible/**,ci/**
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
# Le scanner attend le verdict de la quality gate et échoue si elle ne passe pas
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
